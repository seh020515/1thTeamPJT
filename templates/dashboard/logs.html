{% include 'include/header.html' %}
{% include 'include/nav.html' %}

<main class="logs-container">

    <h2>사고 이력</h2>

    <div class="filter-box">
        <a href="{{ url_for('dashboard.logs', type='all') }}"
           class="filter-btn {{ 'active' if selected_type == 'all' }}">전체</a>
        <a href="{{ url_for('dashboard.logs', type='intrusion') }}"
           class="filter-btn {{ 'active' if selected_type == 'intrusion' }}">위험구역 침입</a>
        <a href="{{ url_for('dashboard.logs', type='drowning') }}"
           class="filter-btn {{ 'active' if selected_type == 'drowning' }}">익수</a>
        <a href="{{ url_for('dashboard.logs', type='rescue') }}"
           class="filter-btn {{ 'active' if selected_type == 'rescue' }}">구조요청</a>
    </div>

    <section class="logs-box">

        <table>

            <thead>
                <tr>
                    <th>번호</th>
                    <th>발생 시간</th>
                    <th>감지 유형</th>
                    <th>위험 위치</th>
                    <th>상태</th>
                </tr>
            </thead>

            <tbody>

                {% for log in logs %}

                <tr>
                    <td>{{ loop.index }}</td>
                    <td>{{ log.time }}</td>
                    <td>{{ log.type_name or log.type }}</td>
                    <td>{{ log.location }}</td>
                    <td>{{ log.status }}</td>
                </tr>

                {% endfor %}

            </tbody>

        </table>

    </section>

</main>

{% include 'include/footer.html' %}
