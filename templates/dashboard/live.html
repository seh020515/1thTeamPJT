{% include 'include/header.html' %}
{% include 'include/nav.html' %}

<main class="live-container">

    <div class="page-title-box">
        <div>
            <h2>실시간 관제</h2>
            <p>드론 영상과 AI 감지 결과를 실시간으로 확인합니다.</p>
        </div>

        <span class="live-status">
            ● LIVE
        </span>
    </div>

    <section class="live-section">

        <div class="live-video-box">

            <div class="video-top-bar">
                <span>DRONE CAMERA</span>
                <strong>ESP32-CAM</strong>
            </div>

            <div class="video-frame">

                <img src="{{ url_for('dashboard.video_feed') }}" alt="실시간 드론 영상">


            </div>

        </div>

        <aside class="live-info-box">

            <h3>AI 감지 결과</h3>

            <div class="info-row">
                <span>드론 상태</span>
                <strong class="status-connected">ONLINE</strong>
            </div>

            <div class="info-row">
                <span>카메라 상태</span>
                <strong class="status-connected">정상</strong>
            </div>

            <div class="info-row">
                <span>AI 상태</span>
                <strong class="status-warning">감지 중</strong>
            </div>

            <div class="info-row">
                <span>감지 유형</span>
                <strong>사람 탐지</strong>
            </div>

            <div class="info-row">
                <span>감지 시간</span>
                <strong>{{ detect_time }}</strong>
            </div>

            <div class="info-row">
                <span>FPS</span>
                <strong>29</strong>
            </div>

        </aside>

    </section>

</main>

{% include 'include/footer.html' %}
